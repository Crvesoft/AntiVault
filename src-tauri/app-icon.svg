<svg viewBox="0 0 512 512" width="512" height="512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Dark Gradient -->
    <linearGradient id="iconBg" x1="64" y1="32" x2="448" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#0F172A" />
      <stop offset="50%" stopColor="#0B132B" />
      <stop offset="100%" stopColor="#030712" />
    </linearGradient>

    <!-- Border Stroke Gradient -->
    <linearGradient id="iconStroke" x1="80" y1="48" x2="432" y2="464" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#38BDF8" stopOpacity="0.85" />
      <stop offset="50%" stopColor="#10B981" stopOpacity="0.6" />
      <stop offset="100%" stopColor="#064E3B" stopOpacity="0.35" />
    </linearGradient>

    <!-- Anti Ribbon Gradient (Upper 'A' Ascension) -->
    <linearGradient id="antiRibbon" x1="112" y1="96" x2="384" y2="224" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#38BDF8" />
      <stop offset="50%" stopColor="#34D399" />
      <stop offset="100%" stopColor="#10B981" />
    </linearGradient>

    <!-- Vault Ribbon Gradient (Lower 'V' Lock) -->
    <linearGradient id="vaultRibbon" x1="128" y1="288" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#059669" />
      <stop offset="50%" stopColor="#10B981" />
      <stop offset="100%" stopColor="#06B6D4" />
    </linearGradient>

    <!-- Levitating Crystal Core Glow -->
    <linearGradient id="coreDiamond" x1="224" y1="216" x2="288" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FFFFFF" />
      <stop offset="100%" stopColor="#67E8F9" />
    </linearGradient>

    <!-- Specular Highlight on Ribbon Top Edge -->
    <linearGradient id="specularEdge" x1="128" y1="96" x2="256" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FFFFFF" stopOpacity="0.9" />
      <stop offset="100%" stopColor="#38BDF8" stopOpacity="0" />
    </linearGradient>
  </defs>

  <!-- Premium Squircle Container -->
  <rect
    x="28"
    y="28"
    width="456"
    height="456"
    rx="128"
    fill="url(#iconBg)"
    stroke="url(#iconStroke)"
    strokeWidth="12"
  />

  <!-- Ambient Inner Subtle Ring -->
  <circle
    cx="256"
    cy="256"
    r="152"
    stroke="#10B981"
    strokeWidth="6"
    strokeOpacity="0.18"
    strokeDasharray="24 24"
  />

  <!-- Isometric Monogram 'A' Ribbon (Anti-Gravity Ascension Delta) -->
  <path
    d="M 120 184 L 256 104 L 384 176 L 312 216 L 256 184 L 184 224 L 184 296 L 120 328 Z"
    fill="url(#antiRibbon)"
    stroke="#6EE7B7"
    strokeWidth="6"
    strokeLinejoin="round"
  />

  <!-- Specular Edge Highlight on Peak -->
  <path
    d="M 136 176 L 256 108 L 368 172"
    stroke="url(#specularEdge)"
    strokeWidth="10"
    strokeLinecap="round"
  />

  <!-- Isometric Monogram 'V' Ribbon (Secure Vault Cradle) -->
  <path
    d="M 392 312 L 256 392 L 128 320 L 200 280 L 256 312 L 328 272 L 328 200 L 392 168 Z"
    fill="url(#vaultRibbon)"
    stroke="#34D399"
    strokeWidth="6"
    strokeLinejoin="round"
  />

  <!-- Center Levitating Anti-Gravity Crystal Core -->
  <polygon
    points="256,216 292,248 256,280 220,248"
    fill="url(#coreDiamond)"
  />

  <!-- Core Specular Dot -->
  <circle cx="256" cy="248" r="12" fill="#FFFFFF" />

  <!-- Ambient Micro-Rays -->
  <line x1="256" y1="196" x2="256" y2="184" stroke="#67E8F9" strokeWidth="8" strokeLinecap="round" />
  <line x1="256" y1="300" x2="256" y2="312" stroke="#34D399" strokeWidth="8" strokeLinecap="round" />
  <line x1="200" y1="248" x2="188" y2="248" stroke="#38BDF8" strokeWidth="8" strokeLinecap="round" />
  <line x1="312" y1="248" x2="324" y2="248" stroke="#10B981" strokeWidth="8" strokeLinecap="round" />
</svg>
